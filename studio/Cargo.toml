[package]
name = "alexander-studio"
version = "0.1.0"
edition = "2021"
description = "Live studio for the alexander film and print simulation"
license = "MIT"

[lib]
name = "alexander_studio"
path = "src/lib.rs"

[[bin]]
name = "alexander-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.31"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
png = "0.17"
qcms = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fast_image_resize = "6.2.0"
jpeg-encoder = "0.7.1"
egui-wgpu = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = "0.15"
block2 = "~0.6.2"
muda = { version = "~0.22.0", default-features = false }
objc2 = "~0.6.5"
objc2-app-kit = { version = "~0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSViewController", "NSWindow"] }
objc2-foundation = { version = "~0.3.2", default-features = false, features = ["std", "block2", "objc2-core-services", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSError", "NSFileManager", "NSGeometry", "NSItemProvider", "NSNotification", "NSObject", "NSOperation", "NSProgress", "NSString", "NSURL"] }
objc2-photos = { version = "~0.3.2", default-features = false, features = ["std", "PHPhotoLibrary"] }
objc2-photos-ui = { version = "~0.3.2", default-features = false, features = ["std", "block2", "PHPicker", "objc2-app-kit", "objc2-photos"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
