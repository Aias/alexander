[package]
name = "alexander-studio"
version = "0.1.0"
edition = "2021"
description = "Live studio for the alexander film and print simulation"
license = "MIT"

[lib]
name = "alexander_studio"
path = "src/lib.rs"

[[bin]]
name = "alexander-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.31"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
png = "0.17"
qcms = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = "0.15"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
